<!-- src/app/components/header/header.html -->
<header class="sticky top-0 z-50 w-full bg-amber-200">
    <div
        class="mx-auto flex w-full max-w-screen-2xl flex-col px-4 py-3 sm:px-8 md:flex-row md:items-center md:justify-between md:px-14 md:py-4">

        <!-- Brand + hamburger -->
        <div class="flex items-center justify-between">
            <a routerLink="/" (click)="closeMenu()"
                class="rounded text-xl font-normal text-black font-['Epilogue'] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-black min-[400px]:text-2xl sm:text-3xl">
                Constança Postiga
            </a>

            <!-- Mobile toggle (44x44px touch target) -->
            <button type="button" (click)="isMenuOpen = !isMenuOpen" [attr.aria-expanded]="isMenuOpen"
                aria-controls="primary-nav" aria-label="Toggle menu"
                class="-mr-2 flex h-11 w-11 items-center justify-center rounded text-black focus-visible:outline-2 focus-visible:outline-black md:hidden">
                @if (isMenuOpen) {
                <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6l12 12M18 6L6 18" />
                </svg>
                } @else {
                <svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                }
            </button>
        </div>

        <!-- Nav: stacked list on mobile, inline row on desktop -->
        <nav id="primary-nav" aria-label="Primary" [class.hidden]="!isMenuOpen"
            class="mt-2 flex flex-col border-t border-black/15 md:mt-0 md:flex md:flex-row md:items-center md:gap-8 md:border-0">
            <a routerLink="/" routerLinkActive="underline" [routerLinkActiveOptions]="{ exact: true }"
                (click)="closeMenu()"
                class="py-3 text-lg font-normal text-black font-['Cal_Sans'] underline-offset-4 hover:underline focus-visible:underline md:py-0 md:text-xl">
                Projects
            </a>
            <a routerLink="/about" routerLinkActive="underline" (click)="closeMenu()"
                class="py-3 text-lg font-normal text-black font-['Cal_Sans'] underline-offset-4 hover:underline focus-visible:underline md:py-0 md:text-xl">
                About
            </a>
            <a routerLink="/contact" routerLinkActive="underline" (click)="closeMenu()"
                class="py-3 text-lg font-normal text-black font-['Cal_Sans'] underline-offset-4 hover:underline focus-visible:underline md:py-0 md:text-xl">
                Contact
            </a>
        </nav>
    </div>
</header>
