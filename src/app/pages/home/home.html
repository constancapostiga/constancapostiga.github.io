<!-- src/app/pages/home/home.html -->
<app-header />

<main>

  <!-- ─── Hero ─────────────────────────────────────────────────────────── -->
  <section class="relative px-5 pt-12 sm:px-8 md:px-14 md:pt-16 overflow-hidden">

    <div class="relative mx-auto max-w-3xl text-center space-y-8 mt-12 sm:mt-16 md:mt-20">

      <!-- Star — upper left, rotates clockwise on scroll -->
      <span aria-hidden="true" class="star pointer-events-none absolute select-none z-0
     left-[2%] top-[-10%]
     sm:left-[-6%] sm:top-[-4%]
     md:left-[-13%] md:top-[-6%]
     size-8 sm:size-16 md:size-20" [style.transform]="starTopRotation">
        <svg viewBox="14 12 59 61" fill="none" xmlns="http://www.w3.org/2000/svg"
          class="w-full h-full rotate-[-13.14deg]">
          <path
            d="M53.7642 12.4048L51.6934 35.1971L72.7301 44.2097L50.4135 49.2834L48.3427 72.0756L36.6211 52.4191L14.3045 57.4929L29.3768 40.2708L17.6552 20.6143L38.6919 29.6269L53.7642 12.4048Z"
            fill="#F8EB7A" />
        </svg>
      </span>

      <!-- Star — lower right, rotates counter-clockwise on scroll -->
      <span aria-hidden="true" class="star pointer-events-none absolute select-none z-0
     left-[90%] top-[calc(100%-4rem)]
     sm:left-[92%] sm:top-[52%]
     md:left-[101%]
     size-8 sm:size-16 md:size-20" [style.transform]="starBottomRotation">
        <svg viewBox="841 243 59 61" fill="none" xmlns="http://www.w3.org/2000/svg"
          class="w-full h-full rotate-[8.42deg]">
          <path
            d="M899.064 255.152L885.39 273.504L898.619 292.179L876.94 284.846L863.266 303.199L863.541 280.314L841.861 272.981L863.711 266.171L863.986 243.286L877.214 261.962L899.064 255.152Z"
            fill="#F8EB7A" />
        </svg>
      </span>
      <h1 class="relative z-10 text-4xl sm:text-5xl md:text-6xl font-normal font-['Adventures_Unlimited']
           leading-tight tracking-widest text-black">
        <span class="block">Hi, I'm Constança Postiga. I'm a graphic designer and this is my portfolio</span>
      </h1>

      <app-button routerLink="/about" text="More About Me" class="relative z-10" />

    </div>
  </section>

  <!-- ─── Tag Strip (auto-scrolling marquee) ─────────────────────────────── -->
  <app-tag-strip [tags]="tags" class="mt-20 sm:mt-28 md:mt-36" />

  <!-- ─── Projects Heading ─────────────────────────────────────────────── -->
  <div id="projects" class="px-5 sm:px-8 md:px-14 mt-20 sm:mt-28 md:mt-36">
    <h2
      class="mx-auto max-w-screen-xl text-center sm:text-left text-4xl font-normal font-['Outfit'] uppercase tracking-wide text-black">
      Projects
    </h2>
  </div>

  <!-- ─── Projects Grid ────────────────────────────────────────────────── -->
  <section class="px-5 pb-16 sm:px-8 md:px-14 mt-14">
    <div class="mx-auto max-w-screen-xl grid grid-cols-1 gap-20 ">

      @for (project of projects; track project.redirect_to) {
      <article class="flex flex-col sm:flex-row gap-6 md:gap-10">

        <!-- Thumbnail -->
        <a [routerLink]="project.redirect_to"
          class="block shrink-0 w-full sm:w-1/2 overflow-hidden rounded-[10px] group">
          <img [src]="project.image" [alt]="project.title" class="w-full aspect-[549/386] object-cover
                      transition-transform duration-500 group-hover:scale-105" />
        </a>

        <!-- Text content -->
        <div class="flex flex-col gap-8 justify-center">

          <!-- Title + Year -->
          <h3 class="font-['Outfit'] text-black">
            <span class="text-2xl sm:text-3xl md:text-4xl font-normal uppercase">{{ project.title }}</span>
            <span class="text-lg sm:text-xl font-normal ml-2 text-neutral-500">({{ project.year }})</span>
          </h3>

          <!-- Description -->
          <p class="text-base sm:text-lg md:text-xl font-normal font-['Outfit'] text-black leading-relaxed">
            {{ project.description }}
          </p>

          <!-- CTA -->
          <app-button [routerLink]="project.redirect_to" text="Learn More" class="self-center sm:self-start" />

        </div>

      </article>
      }

    </div>
  </section>

</main>

<app-footer />
